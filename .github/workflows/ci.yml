
name: Frontend CI/CD

on:
  push:
    branches:
      - develop
      - main
      - ci/frontend-actions
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy frontend to Render
    needs: frontend-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "::error::FRONTEND_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST "$FRONTEND_DEPLOY_HOOK_URL"
