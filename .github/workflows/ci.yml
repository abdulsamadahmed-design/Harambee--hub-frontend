name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
      - ci/frontend-actions
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
